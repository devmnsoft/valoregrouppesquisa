name: Publish .NET project
on:
  workflow_call:
    inputs:
      project: { required: true, type: string }
      artifact: { required: true, type: string }
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { global-json-file: backend/global.json }
      - run: dotnet publish '${{ inputs.project }}/${{ inputs.project }}.csproj' -c Release -o 'artifacts/${{ inputs.project }}' 2>&1 | tee 'artifacts/${{ inputs.artifact }}.log'
        working-directory: backend
      - uses: actions/upload-artifact@v4
        with: { name: '${{ inputs.artifact }}', path: 'backend/artifacts/${{ inputs.artifact }}*', if-no-files-found: error }
