name: PostgreSQL canonical contract
on:
  workflow_call:
    inputs:
      postgres-version: { required: true, type: string }
      scenario: { required: true, type: string }
      executions: { required: true, type: number }
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:${{ inputs.postgres-version }}
        env: { POSTGRES_USER: valora, POSTGRES_PASSWORD: valora, POSTGRES_DB: valorapesquisa_ci }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U valora -d valorapesquisa_ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: valora
      DATABASE_URL: postgresql://valora:valora@localhost:5432/valorapesquisa_ci
    steps:
      - uses: actions/checkout@v4
      - name: Create partial fixture without another SQL file
        if: inputs.scenario == 'partial'
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE SCHEMA valorapesquisa' \
            -c "CREATE TABLE valorapesquisa.privacy_requests(id uuid PRIMARY KEY, requester_hash text NOT NULL, request_type text NOT NULL, status text NOT NULL DEFAULT 'open', created_at timestamptz NOT NULL DEFAULT now(), updated_at timestamptz)" \
            -c 'CREATE TABLE valorapesquisa.organization_branding(id uuid PRIMARY KEY, organization_id uuid)' \
            -c 'CREATE TABLE valorapesquisa.user_invitations(id uuid PRIMARY KEY, organization_id uuid)'
      - name: Create revoked_at regression fixture
        if: inputs.scenario == 'revoked-at'
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE SCHEMA valorapesquisa' \
            -c 'CREATE TABLE valorapesquisa.user_sessions(id uuid PRIMARY KEY, status text)'
      - name: Create legacy convergence fixture
        if: inputs.scenario == 'legacy'
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE SCHEMA valorapesquisa' \
            -c 'CREATE TABLE valorapesquisa.plan_usage_counters(organization_id uuid, resource_code text, used_value bigint, updated_at timestamptz DEFAULT now())' \
            -c "CREATE TABLE valorapesquisa.plan_usage_reservations(id uuid PRIMARY KEY DEFAULT gen_random_uuid(), organization_id uuid, resource_code text, amount bigint, status text DEFAULT 'reserved', idempotency_key text, expires_at timestamptz, created_at timestamptz DEFAULT now(), updated_at timestamptz DEFAULT now())"
      - name: PostgreSQL ${{ inputs.postgres-version }} — first execution
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/database/postgresql/script_completo.sql | tee postgres-${{ inputs.postgres-version }}-first.log
      - name: PostgreSQL ${{ inputs.postgres-version }} — idempotency rerun
        if: inputs.executions >= 2
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/database/postgresql/script_completo.sql | tee postgres-${{ inputs.postgres-version }}-second.log
      - name: PostgreSQL ${{ inputs.postgres-version }} — third execution
        if: inputs.executions >= 3
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/database/postgresql/script_completo.sql | tee postgres-${{ inputs.postgres-version }}-third.log
      - name: Validate schema isolation and protocol
        run: |
          test "$(psql "$DATABASE_URL" -Atc "select count(*) from pg_tables where schemaname='public'")" = 0
          test "$(psql "$DATABASE_URL" -Atc "select count(*) from pg_indexes where schemaname='valorapesquisa' and indexname='idx_privacy_requests_protocol'")" = 1
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-${{ inputs.postgres-version }}-${{ inputs.scenario }}
          path: postgres-${{ inputs.postgres-version }}-*.log
          if-no-files-found: error
