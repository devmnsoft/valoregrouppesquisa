name: Backend ASP.NET Core validation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Restore, build, test and validate PostgreSQL
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: valora
          POSTGRES_PASSWORD: valora
          POSTGRES_DB: valorapesquisa_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U valora -d valorapesquisa_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json

      - name: Restore
        run: dotnet restore Valora.sln

      - name: Build
        run: dotnet build Valora.sln --configuration Release --no-restore

      - name: Unit tests
        run: tools/ci/run-filtered-tests.sh Unit unit-tests.trx

      - name: Architecture tests
        run: tools/ci/run-filtered-tests.sh Architecture architecture-tests.trx

      - name: Static contract tests
        run: tools/ci/run-filtered-tests.sh StaticContract static-contract-tests.trx

      - name: Apply canonical database — first
        env:
          PGPASSWORD: valora
        run: psql -h localhost -U valora -d valorapesquisa_ci -v ON_ERROR_STOP=1 -f database/postgresql/banco_completo.sql | tee database-first.log

      - name: Apply canonical database — second
        env:
          PGPASSWORD: valora
        run: psql -h localhost -U valora -d valorapesquisa_ci -v ON_ERROR_STOP=1 -f database/postgresql/banco_completo.sql | tee database-second.log

      - name: Export schema
        env:
          PGPASSWORD: valora
        run: psql -h localhost -U valora -d valorapesquisa_ci -f tools/database/export-schema-contract.sql > database-schema-canonical.log

      - name: Apply migrations
        env:
          PGPASSWORD: valora
          VALORA_TEST_POSTGRES_CONNECTION: postgresql://valora:valora@localhost:5432/valorapesquisa_ci
        run: tools/database/apply-migrations.sh migrations.log

      - name: Verify schema
        env:
          PGPASSWORD: valora
        run: |
          psql -h localhost -U valora -d valorapesquisa_ci -f tools/database/export-schema-contract.sql > database-schema-migrated.log
          python3 tools/database/compare-schema-contract.py database-schema-canonical.log database-schema-migrated.log

      - name: Database contract tests
        run: tools/ci/run-filtered-tests.sh DatabaseContract database-contract-tests.trx

      - name: Integration tests
        env:
          ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=valorapesquisa_ci;Username=valora;Password=valora
          VALORA_TEST_POSTGRES_CONNECTION: Host=localhost;Port=5432;Database=valorapesquisa_ci;Username=valora;Password=valora
        run: tools/ci/run-filtered-tests.sh Integration integration-tests.trx

      - name: BFF integration tests
        run: tools/ci/run-filtered-tests.sh BffIntegration bff-integration-tests.trx

      - name: Phase 2H.2 validation
        run: node tools/validation/validate-phase2h2.js

      - name: Format check
        run: dotnet format Valora.sln --verify-no-changes

      - name: Publish validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-validation-evidence
          path: |
            backend/**/TestResults/*.trx
            backend/database-*.log
            backend/migrations.log
            backend/database-schema-*.log
            backend/playwright-report/**
          if-no-files-found: warn
